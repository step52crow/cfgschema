[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "step52crow-cfgschema"
version = "0.1.0"
description = "按段落统计配置的 schema 校验相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "step52crow" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://step52crow.github.io"
Repository = "https://github.com/step52crow/cfgschema"
Issues = "https://github.com/step52crow/cfgschema/issues"

[project.scripts]
cfgschema = "cfgschema:main"

[tool.setuptools]
py-modules = ["cfgschema"]
